{% set name = "datarobot-bp-workshop" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 4599fe7b5605011bcaca785a48961195ca2d6dc243564c1d23f9387d3bb9b613

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python >=3.7
  run:
    - datarobot >=2.27.0,<4
    - pandas <1.3.6,>=0.15
    - python-graphviz >=0.16,<1
    - typing-extensions ==4.3.0
    - networkx >=2.2
    - python >=3.7

test:
  imports:
    - datarobot_bp_workshop
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://blueprint-workshop.datarobot.com
  summary: This client library is designed to support building DataRobot blueprints.
  license: LicenseRef-Modified-BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - danna-naser
